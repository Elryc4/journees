<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Journées">
<meta name="theme-color" content="#f2f1ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Journées & pleins</title>
<style>
/* VOICE: outil de cabine, sobre et direct
   IDEA: le disque/chronotachygraphe et le marquage routier
   PICTURE: les deux gros boutons DÉPART / ARRIVÉE
   COLOUR and TYPE: fond papier, encre, vert départ, jaune marquage, rouge alerte ; police système
   LAYOUT: une colonne, barre d'onglets en bas */
:root{color-scheme:light dark;
--bg:light-dark(#f2f1ec,#121416);--card:light-dark(#ffffff,#1d2024);--ink:light-dark(#15191d,#eef0f2);
--mut:light-dark(#5f6870,#9aa3ab);--line:light-dark(#dcdcd4,#30353a);--go:#15834a;--arr:light-dark(#1f2a35,#3b4b5c);
--yel:#f0b81c;--red:#d3311f;--chip:light-dark(#ecebe4,#272b30)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none;touch-action:manipulation}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{overflow-x:clip;padding:env(safe-area-inset-top) 0 calc(74px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 14px 20px}
h1{font-size:26px;line-height:1.1;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:17px;margin:22px 0 8px}
.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.bigb{border:0;border-radius:20px;color:#fff;font-weight:800;font-size:22px;letter-spacing:.04em;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bigb small{font-weight:500;font-size:13px;letter-spacing:0;opacity:.85}
.bigb:active{transform:translateY(2px);box-shadow:none}
.bdep{background:var(--go)}.barr{background:var(--arr)}.bigb.st-g{background:#7d838a}.bigb.st-r{background:#b44a42}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--chip);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--mut)}
.tile.warn b{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.boxes{display:flex;gap:8px}
.box{width:38px;height:38px;border-radius:9px;border:2px solid var(--ink);background:transparent;padding:0}
.box.on{background:var(--yel);border-color:var(--yel);box-shadow:inset 0 0 0 3px var(--card)}
.box.auto{cursor:default}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.ctr+.ctr{border-top:1px solid var(--line)}
.btn{border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-weight:600;font-size:16px;line-height:1;font-family:inherit;min-height:46px;padding:0 16px}
.btn.pri{background:var(--go);color:#fff}.btn.dark{background:var(--arr);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.badge{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px;padding:0 6px;margin-left:6px}
.banner{border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;font-size:15px}
.banner.y{background:color-mix(in srgb,var(--yel) 25%,var(--card))}
.banner.r{background:color-mix(in srgb,var(--red) 18%,var(--card));color:var(--ink)}
.banner.g{background:color-mix(in srgb,var(--go) 16%,var(--card))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{background:none;border:0;color:var(--mut);font-weight:600;font-size:11px;line-height:1.2;font-family:inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs .dot{position:absolute;top:3px;left:calc(50% + 8px);width:9px;height:9px;border-radius:5px;background:var(--red)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list li .t{flex:1}.list li .t small{display:block;color:var(--mut);font-size:13px}
.chipst{display:inline-block;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;background:var(--chip)}
.chipst.paye{background:color-mix(in srgb,var(--go) 22%,var(--card))}.chipst.rass{background:color-mix(in srgb,var(--yel) 35%,var(--card))}.chipst.np{background:var(--chip)}.chipst.pend{background:var(--red);color:#fff}
/* feuilles modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.shbar{position:sticky;top:-16px;height:0;z-index:3}.shx{position:absolute;right:-6px;top:-6px;width:40px;height:40px;border-radius:20px;border:0;background:var(--chip);color:var(--ink);font-size:17px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sheet h3{padding-right:44px;margin:0 0 12px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov,.sheet{animation:none}}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
input,select{display:block;width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 10px;margin-top:4px;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.fg{margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plrow{display:grid;grid-template-columns:1fr 64px 60px;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 12px;font-weight:600;font-size:14px;font-family:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.sugg button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit;color:var(--ink)}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog button{flex:1;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit}
.tog button.on{border-color:var(--go);background:color-mix(in srgb,var(--go) 15%,var(--card))}
.acts{display:flex;gap:10px;margin-top:16px}.sheet .acts{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom));z-index:2;box-shadow:0 -10px 12px -12px rgba(0,0,0,.35)}.acts .btn{flex:1}
.check{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;font-weight:600;font-size:16px;font-family:inherit;color:var(--ink)}
.check input{width:24px;height:24px;min-height:0;margin:0;accent-color:var(--go)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:40px;font-weight:600;font-size:14px;font-family:inherit;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mnav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.mnav b{flex:1;text-align:center;font-size:17px}
.prev{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.prev svg{display:block;width:100%;height:auto}
.cmpt{border-collapse:collapse;font-size:14px;min-width:100%}.cmpt th,.cmpt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.cmpt td:first-child,.cmpt th:first-child{text-align:left;white-space:normal;min-width:120px;color:var(--mut)}.cmpt th{vertical-align:top}
.dtb{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:4px 0 6px}
.dtb label{padding:8px 12px 6px;margin:0}.dtb label+label{border-left:1px solid var(--line)}
.dtb input{-webkit-appearance:none;appearance:none;border:0;background:none;padding:2px 0 4px;margin:0;min-height:0;width:100%;min-width:0;text-align:left;color:var(--ink)}
.dtb input::-webkit-date-and-time-value{text-align:left}
.dtd input{font-size:17px;font-weight:600}.dtt input{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
input[type=date],input[type=time]{min-width:0;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;z-index:30;display:flex;gap:14px;align-items:center;font-size:15px;width:max-content;max-width:min(92vw,560px);box-shadow:0 4px 16px rgba(0,0,0,.25)}.toast span{flex:1 1 auto;min-width:0;line-height:1.3}.toast button{flex:none;white-space:nowrap;background:none;border:0;font-weight:700;font-size:15px;line-height:1;font-family:inherit}.toast .tx{color:inherit;opacity:.6;font-size:16px;padding:8px 2px 8px 10px}.toast .tu{color:var(--yel);padding:10px 12px 10px 2px}.toast .tsep{align-self:stretch;width:1px;background:currentColor;opacity:.25;margin-right:6px}.toast.out{opacity:0;transition:opacity .18s}

body.noscroll{position:fixed;inset:0;overflow:hidden}
body.noscroll main{height:calc(100dvh - 74px - env(safe-area-inset-bottom) - env(safe-area-inset-top));display:flex;flex-direction:column;padding-bottom:10px;overflow:hidden}
body.noscroll .big2{flex:1;min-height:100px}body.noscroll .bigb{min-height:0}
body.noscroll h1{margin:2px 0 6px}body.noscroll .card{margin:6px 0}
.amp{position:relative;background:var(--chip);border-radius:12px;padding:20px 12px 8px}
.amp span{position:absolute;top:6px;right:10px;font-size:12px;color:var(--mut);font-weight:600}
.stt{background:var(--chip);border-radius:12px;padding:9px 12px 10px}.stt span{display:block;font-size:12.5px;line-height:1.25;color:var(--mut);font-weight:600;min-height:2.5em}.stt b{display:block;font-size:22px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amp b{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.amp.warn b{color:var(--red)}.amp.nope{opacity:.55;overflow:hidden}.amp.nope b{text-decoration:line-through;text-decoration-color:#c0504a;text-decoration-thickness:2px}.amp.nope::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top right,transparent calc(50% - 1px),#c0504a calc(50% - .5px),#c0504a calc(50% + .5px),transparent calc(50% + 1px))}
.big-time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.alert{color:var(--red);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
{
/* ================== utilitaires ================== */
const APP_VERSION='1.2';const HR=3600e3, DAY=86400e3, KEY='jp-data-v1';
const pad=n=>String(n).padStart(2,'0');
const fT=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dk=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const kDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=kDate(k);d.setDate(d.getDate()+n);return dk(d.getTime())};
const JL=['D','L','M','M','J','V','S'], JN=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MOIS=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
const Mois=m=>MOIS[m].charAt(0)+MOIS[m].slice(1).toLowerCase();
const fD=ms=>{const d=new Date(ms);return JN[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fK=k=>fD(kDate(k).getTime());
const fDur=ms=>{const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+' h '+pad(m%60)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);
const inputsToMs=(dv,tv)=>{const [y,m,d]=dv.split('-').map(Number);const [h,mi]=tv.split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime()};
const plStr=p=>!p||!p.n?'—':p.n+(p.d?' ('+p.d+')':'')+(p.p&&p.p!=='F'?' '+p.p:'');

/* ================== jours fériés ================== */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const ferC={};
function feries(y){if(ferC[y])return ferC[y];const e=easter(y);const add=n=>dk(new Date(y,e.getMonth(),e.getDate()+n).getTime());
return ferC[y]=new Set([y+'-01-01',add(1),y+'-05-01',y+'-05-08',add(39),add(50),y+'-07-14',y+'-08-15',y+'-11-01',y+'-11-11',y+'-12-25'])}
const isGrey=k=>{const w=kDate(k).getDay();return w===0||w===6||feries(+k.slice(0,4)).has(k)};

/* ================== données ================== */
const DEF={v:1,settings:{setup:false,societe:'',nom:'',tracteur:'',remorque:'',depotNom:'',depotDep:'',domDep:''},
services:[],pleins:[],lavages:[],absences:[],wk:{},drv:[],places:[],km:{},aliases:[],trucks:null,consoRef:[],consoFlags:{},rass:{},oldTrucks:[],airRef:{},lastBackup:0};
let S, storageOK=true;
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
 let d=null;try{d=raw?JSON.parse(raw):null}catch(e){d=null}
 return migrate(d||JSON.parse(JSON.stringify(DEF)))}
function migrate(d){const o=JSON.parse(JSON.stringify(DEF));for(const k in o){if(d[k]===undefined)d[k]=o[k]}
 d.settings=Object.assign({},o.settings,d.settings||{});
 if(!d.trucks){const t=new Date();t.setHours(0,0,0,0);d.trucks=d.settings.tracteur?[{immat:d.settings.tracteur,since:t.getTime()}]:[]}
 return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
S=load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================== absences ================== */
const ABS={'CONGÉ':'Congé','FORMATION':'Formation','AT':'AT'};
const absOn=k=>S.absences.find(a=>a.from<=k&&k<=a.to);
function removeAbsDay(a,k){S.absences=S.absences.filter(x=>x!==a);
 const p=addDays(k,-1),n=addDays(k,1);
 if(a.from<=p)S.absences.push({...a,id:uid(),to:p});
 if(n<=a.to)S.absences.push({...a,id:uid(),from:n})}

/* ================== analyse RSE ================== */
function deadlineOf(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+28);return d.getTime()-60000}
function wkAuto(r){const n=norm(r.a.ep&&r.a.ep.n);if(!n)return null;
 if(n==='depot'||(S.settings.depotNom&&n===norm(S.settings.depotNom)))return 'depot';
 if(n==='domicile')return 'dom';return null}
const wkStatus=r=>wkAuto(r)||S.wk[r.a.id]||null;
function analyze(now=Date.now()){
 const sv=[...S.services].sort((a,b)=>a.s-b.s);
 const rests=[];
 sv.forEach((a,i)=>{if(!a.e)return;const b=sv[i+1]||null;
  rests.push(b?{a,b,from:a.e,to:b.s,gap:b.s-a.e,done:true}:{a,b:null,from:a.e,to:now,gap:now-a.e,done:false})});
 const touchWE=(f,t)=>{for(let k=dk(f);k<=dk(t);k=addDays(k,1)){const w=kDate(k).getDay();if(w===0||w===6)return true}return false};
 rests.forEach(r=>r.weekly=r.gap>=45*HR||(r.gap>=24*HR&&touchWE(r.from,r.to)));
 let cycleStart=0;for(const r of rests)if(r.weekly)cycleStart=r.done?r.to:Infinity;
 const last=sv[sv.length-1]||null, open=last&&!last.e?last:null;
 let reduced=0;const alerts=[];
 for(const a of sv){if(a.s<cycleStart)continue;
  const amp=(a.e||now)-a.s, r=rests.find(x=>x.a===a);
  const short=r&&r.done&&!r.weekly&&r.gap<11*HR;
  if(amp>13*HR||short)reduced++;
  if(amp>15*HR)alerts.push('Amplitude de '+fDur(amp)+' ('+fD(a.s)+') : maximum 15 h');
  if(r&&r.done&&!r.weekly&&r.gap<9*HR)alerts.push('Repos de '+fDur(r.gap)+' après le '+fD(a.s)+' : minimum 9 h')}
 if(reduced>3)alerts.push(reduced+' repos réduits depuis le dernier repos hebdo : maximum 3');
 const drv=S.drv.filter(t=>t>=cycleStart).length;
 const debts=[];
 for(const r of rests){if(!r.done)continue;
  if(r.weekly&&r.gap<45*HR){debts.push({r,h:45*HR-r.gap,deadline:deadlineOf(r.from),settled:null});continue}
  const base=r.weekly?45*HR:(r.gap>=11*HR?11*HR:null);if(base==null)continue;
  let acc=0;for(const d of debts){if(d.settled)continue;if(r.gap>=base+acc+d.h){acc+=d.h;d.settled=r}else break}}
 const openDebts=debts.filter(d=>!d.settled);
 openDebts.forEach(d=>{if(now>d.deadline)alerts.push('Rattrapage de '+fDur(d.h)+' en retard (date limite '+fD(d.deadline)+')')});
 const weeklies=rests.filter(r=>r.weekly);
 const pendingWk=weeklies.filter(r=>r.done&&!wkStatus(r)&&r.to>now-14*DAY);
 return {sv,rests,cycleStart,last,open,reduced,alerts,drv,debts,openDebts,weeklies,pendingWk,now}}

/* ================== lieux & communes ================== */
let COM=[], comState='absent';
const ISO2PL={fr:'F',it:'I',pl:'PL',de:'D',es:'E',be:'B',nl:'NL',lu:'L',ch:'CH',at:'A',pt:'P',gb:'GB',cz:'CZ',sk:'SK',hu:'H',si:'SLO',hr:'HR',dk:'DK',se:'S',no:'N',ro:'RO',bg:'BG',ie:'IRL',gr:'GR',li:'FL',mc:'MC',ad:'AND',lt:'LT',lv:'LV',ee:'EST',fi:'FIN'};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('jp-geo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

function openKm(y,m){const k=kmGet(y,m),N=new Date(y,m+1,0).getDate();
 sheet(`<h3>Kilométrages ${Mois(m).toLowerCase()} ${y}</h3><div class="g2"><label>KMS au 1er<input id="k1" type="number" inputmode="numeric" value="${esc(k.start||'')}"></label><label>KMS au ${N}<input id="k2" type="number" inputmode="numeric" value="${esc(k.end||'')}"></label></div>
 <div class="acts"><button class="btn" id="kx">Annuler</button><button class="btn pri" id="kok">Enregistrer</button></div>`,(el,close)=>{$('kx').onclick=close;
 $('kok').onclick=()=>{S.km=S.km||{};S.km[mkey(y,m)]={start:$('k1').value.trim(),end:$('k2').value.trim()};save();close();render();toast('Kilométrages enregistrés')}})}
function kmReminder(A){const now=A.now,t=dk(now),d=new Date(now),y=d.getFullYear(),m=d.getMonth();
 const inM=A.sv.filter(s=>{const x=new Date(s.s);return x.getFullYear()===y&&x.getMonth()===m});
 if(!inM.some(s=>dk(s.s)===t))return null;const k=kmGet(y,m);
 if(!k.start&&dk(inM[0].s)===t)return 'du 1er';

let pm=new Date();pm=new Date(pm.getFullYear(),pm.getMonth(),1);
const isDepot=p=>{const n=norm(p&&p.n);return n==='depot'||(S.settings.depotNom&&n===norm(S.settings.depotNom))};
function pleinDesc(x){const t=[];if(x.g.on)t.push('Gasoil '+(x.g.v?x.g.v+' L':'?'));if(x.n.on)t.push('GNR'+(x.n.v?' '+x.n.v+' L':''));if(x.a.on)t.push('AdBlue'+(x.a.v?' '+x.a.v+' L':''));return t.join(' · ')}
function pleinsHTML(){const y=pm.getFullYear(),m=pm.getMonth();const inM=t=>{const d=new Date(t);return d.getFullYear()===y&&d.getMonth()===m};
 const P=S.pleins.filter(x=>inM(x.t)).sort((a,b)=>b.t-a.t),L=S.lavages.filter(x=>inM(x.t)).sort((a,b)=>b.t-a.t);
 return `<h1>Pleins & lavages</h1><div class="big2"><button class="bigb bdep" id="np" style="min-height:96px">+ PLEIN</button><button class="bigb barr" id="nl" style="min-height:96px">+ LAVAGE</button></div>
 <div class="mnav"><button class="btn sm" id="pp">‹</button><b>${Mois(m)} ${y}</b><button class="btn sm" id="pn">›</button></div>
 <button class="btn full" id="pconso">Consommation</button>
 <h2>Pleins (${P.length})</h2><ul class="list" id="lp">${P.map(x=>`<li data-id="${x.id}"><div class="t">${fD(x.t)}<small>${esc(pleinDesc(x))}${x.g.on?(x.full===false?' (partiel)':' (complet)'):''} — ${esc(x.immat||'')}${x.km?' — '+esc(x.km)+' km':''} — ${esc(plStr(x.lieu))}</small></div><span class="muted">›</span></li>`).join('')||'<li class="muted">Aucun plein ce mois-ci</li>'}</ul>
 <h2>Lavages (${L.length})</h2><ul class="list" id="ll">${L.map(x=>`<li data-id="${x.id}"><div class="t">${fD(x.t)}<small>${[x.ext?'Extérieur':'',x.int?'Intérieur':''].filter(Boolean).join(' + ')} — ${esc(x.tr||'')} / ${esc(x.re||'')}</small></div><span class="muted">›</span></li>`).join('')||'<li class="muted">Aucun lavage ce mois-ci</li>'}</ul>`}

 $('lp').onclick=e=>{const li=e.target.closest('li[data-id]');if(li)openPlein(S.pleins.find(x=>x.id===li.dataset.id))};

/* ================== consommation ================== */
const num=v=>{const x=parseFloat(String(v??'').replace(',','.').replace(/\s/g,''));return isFinite(x)?x:null};
const f1=x=>x.toFixed(1).replace('.',',');const fkm=x=>Math.round(x).toLocaleString('fr-FR');
function consoChain(P){const seg=[];let base=null,acc=0,broken=false,brokeWhy='';
 for(const x of P){const v=num(x.g.v),km=num(x.km),full=x.full!==false;
  if(v==null){broken=true;brokeWhy='volume manquant';if(full&&km!=null){if(base)seg.push({from:base,to:x,ok:false,why:brokeWhy});base=x;acc=0;broken=false}continue}
  if(!base){if(full&&km!=null){base=x;acc=0;broken=false}continue}
  acc+=v;if(!full||km==null)continue;
  const d=km-num(base.km);
  if(broken)seg.push({from:base,to:x,ok:false,why:brokeWhy});else if(d<=0)seg.push({from:base,to:x,ok:false,why:'kilométrage incohérent'});
  else seg.push({from:base,to:x,ok:true,km:d,l:acc,c:acc/d*100});
  base=x;acc=0;broken=false}
 return {seg,base}}
const gasP=x=>x.g&&x.g.on;
function consoNorm(segs){const F=S.consoFlags||{};const pts=[...(S.consoRef||[]).filter(r=>r.km>0&&r.l>0).map(r=>({l:r.l,km:r.km}))];
 for(const s of segs)if(s.ok&&(F[s.to.id]==='ok'||(F[s.to.id]!=='excl'&&s.c>=20&&s.c<=40)))pts.push(s);
 if(pts.length>=10){const L=pts.reduce((a,p)=>a+p.l,0),K=pts.reduce((a,p)=>a+p.km,0),m=L/K*100;return {lo:m*0.7,hi:m*1.3,m,n:pts.length,learned:true}}
 return {lo:20,hi:40,n:pts.length,learned:false}}
function consoTruck(tr){const P=S.pleins.filter(x=>x.immat===tr.immat&&x.t>=tr.since&&(!tr.until||x.t<=tr.until)&&gasP(x)).sort((a,b)=>a.t-b.t||(num(a.km)||0)-(num(b.km)||0));
 const {seg,base}=consoChain(P);const G=absGaps().filter(g=>g.moved);for(const sg of seg)if(sg.ok&&G.some(g=>g.tOut>=sg.from.t&&g.tIn<=sg.to.t)){sg.ok=false;sg.why='camion utilisé pendant ton absence'}const N=consoNorm(seg);const F=S.consoFlags||{};
 for(const s of seg)if(s.ok){const out=s.c<N.lo||s.c>N.hi;s.flag=F[s.to.id]||null;s.out=out;s.use=s.flag==='ok'||(!out&&s.flag!=='excl')}
 const ok=seg.filter(s=>s.ok&&s.use);const L=ok.reduce((a,s)=>a+s.l,0),K=ok.reduce((a,s)=>a+s.km,0);
 const months={};for(const s of ok){const a=new Date(s.from.t),b=new Date(s.to.t);if(a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()){const k=a.getFullYear()+'-'+pad(a.getMonth()+1);const o=months[k]=months[k]||{l:0,km:0};o.l+=s.l;o.km+=s.km}}
 return {seg,L,K,avg:K?L/K*100:null,months,base,N}}
function otherTrucks(){const mine=new Set((S.trucks||[]).map(t=>t.immat));const g={};
 for(const x of S.pleins)if(x.immat&&!mine.has(x.immat)&&gasP(x))(g[x.immat]=g[x.immat]||[]).push(x);
 return Object.keys(g).map(im=>({im,seg:consoChain(g[im].sort((a,b)=>a.t-b.t)).seg.filter(s=>s.ok)})).filter(o=>o.seg.length)}
async function consoCheck(pl){const tr=(S.trucks||[]).find(t=>t.immat===pl.immat&&pl.t>=(t.service?inputsToMs(t.service,'00:00'):t.since)&&(!t.until||pl.t<=t.until));if(!tr)return;
 const cap=(tr.tanks||[]).reduce((a,v)=>a+(num(v)||0),0),vv=num(pl.g&&pl.g.on&&pl.g.v);
 if(cap&&vv&&vv>cap*1.05){const v=await ask('⚠️ Volume hors normes',`${f1(vv)} L de gasoil, alors que tes réservoirs font ${fkm(cap)} L au total. Erreur de saisie ?`,[{t:'Corriger',v:'fix',c:'pri'},{t:"C'est correct",v:0}]);if(v==='fix'){openPlein(pl);return}}
 if(pl.full===false||pl.t<tr.since)return;
 const r=consoTruck(tr);const s=r.seg.find(x=>x.to.id===pl.id);if(!s||!s.ok||!s.out||s.flag)return;
 const v=await ask('⚠️ Valeur hors normes : '+f1(s.c)+' L/100',`${fD(s.from.t)} → ${fD(s.to.t)} · ${fkm(s.km)} km · ${f1(s.l)} L<br>Normal : entre ${f1(r.N.lo)} et ${f1(r.N.hi)} L/100. As-tu oublié un plein ?`,[{t:"J'ai oublié un plein",v:'excl',c:'dark'},{t:"C'est correct",v:'ok',c:'pri'},{t:'Décider plus tard',v:null}]);
 if(v){(S.consoFlags=S.consoFlags||{})[pl.id]=v;save()}}
function openConso(){const T=(S.trucks||[]).slice().reverse();
 const segLi=(s,i)=>`<li ${s.ok&&s.out?`data-f="${s.to.id}"`:''}><div class="t">${fD(s.from.t)} → ${fD(s.to.t)}<small>${s.ok?fkm(s.km)+' km · '+f1(s.l)+' L'+(s.out?(s.flag==='ok'?' · <b>validée</b>':s.flag==='excl'?' · <b>exclue (plein oublié)</b>':' · <span style="color:#d97a00;font-weight:700">valeur hors normes : non comptée</span>'):''):'<span class="alert">'+s.why+' : non calculé</span>'}</small></div><b style="${s.ok&&s.out&&!s.use?'color:#d97a00':''}">${s.ok?f1(s.c):'—'}</b></li>`;
 const blk=(tr,i)=>{const r=consoTruck(tr);const cur=i===0&&!tr.until;
  return `<div class="card"><div class="row"><b class="sp">${esc(tr.immat)}${cur?'':' (ancien)'}</b><span class="muted">depuis le ${fD(tr.since)}${tr.until?' → '+fD(tr.until):''}</span></div>
  <div class="amp" style="margin-top:8px"><span>Moyenne ${cur?'depuis toujours':'du camion'}</span><b>${r.avg!=null?f1(r.avg)+' L/100':'—'}</b></div>
  ${r.K?`<div class="muted" style="margin-top:4px">${fkm(r.K)} km · ${f1(r.L)} L</div>`:`<div class="muted" style="margin-top:6px">${r.base?'Point de départ : plein complet du '+fD(r.base.t)+' à '+fkm(num(r.base.km))+' km. Le calcul commencera au prochain plein complet.':'En attente d\'un premier plein complet avec kilométrage.'}</div>`}
  <div class="muted" style="margin-top:4px">Plage normale : ${f1(r.N.lo)} – ${f1(r.N.hi)} L/100 ${r.N.learned?'(apprise sur tes pleins)':'(par défaut, apprentissage '+r.N.n+'/10)'}</div>
  ${Object.keys(r.months).length?`<h2>Par mois</h2><ul class="list">${Object.keys(r.months).sort().reverse().map(k=>{const o=r.months[k];const [yy,mm]=k.split('-');return `<li><div class="t">${Mois(+mm-1)} ${yy}<small>${fkm(o.km)} km · ${f1(o.l)} L</small></div><b>${f1(o.l/o.km*100)}</b></li>`}).join('')}</ul>`:''}

 try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return 'ok'}}}catch(e){if(e&&e.code==='declined')return 'abort'}

const fHM=min=>pad(Math.floor(min/60)%24)+':'+pad(Math.round(min)%60);
const isDom=p=>norm(p&&p.n)==='domicile';
function nightsIn(a,b){let n=0;const d=new Date(a);d.setHours(24,0,0,0);while(d.getTime()<b){n++;d.setDate(d.getDate()+1)}return n}
function computeStats(){const A=analyze();const Y={};const mk=t=>{const d=new Date(t);return [d.getFullYear(),d.getMonth()]};
 const box=(y,m)=>{const o=Y[y]=Y[y]||{months:{},tot:{}};return [o.months[m]=o.months[m]||{days:new Set(),we:new Set(),fer:new Set(),night:0,amp:0,nd:0,wep:0,rass:0,km:null,gas:0,L:{days:[],we:[],fer:[],night:[],amp:[],nd:[],wep:[],rass:[],km:[],gas:[]}},o]};
 const av={};let curM='';const avAdd=(y,k,v)=>{for(const z of [y,'all',curM]){const o=av[z]=av[z]||{};const a=o[k]=o[k]||[0,0];a[0]+=v;a[1]++}};
 for(const v of A.sv){const [y,m]=mk(v.s);curM=y+'-'+m;const [b]=box(y,m);const k=dk(v.s),w=kDate(k).getDay();const it={t:v.s,x:fD(v.s)+' · '+fT(v.s)+' → '+(v.e?fT(v.e):'…')+' · '+(v.ep&&v.ep.n?plStr(v.ep):'')};
  if(!b.days.has(k)){b.L.days.push(it);if(w===0||w===6)b.L.we.push(it);if(feries(+k.slice(0,4)).has(k))b.L.fer.push(it)}
  b.days.add(k);if(w===0||w===6)b.we.add(k);if(feries(+k.slice(0,4)).has(k))b.fer.add(k);
  if(!v.e)continue;const amp=v.e-v.s,h=new Date(v.s).getHours();b.amp+=amp;b.L.amp.push({t:v.s,x:fD(v.s)+' · '+fDur(amp)});if(h>=12&&dk(v.e)!==k){b.night++;b.L.night.push(it)}
  avAdd(y,'amp',amp);if(h<12){const ds=new Date(v.s),de=new Date(v.e);avAdd(y,'dep',ds.getHours()*60+ds.getMinutes());if(dk(v.e)===k)avAdd(y,'fin',de.getHours()*60+de.getMinutes())}}
 for(const r of A.rests){if(!r.done)continue;const [y,m]=mk(r.from);curM=y+'-'+m;const [b]=box(y,m);
  if(!r.weekly){if(r.a.ep&&r.a.ep.n&&!isDom(r.a.ep)){b.nd++;b.L.nd.push({t:r.from,x:fD(r.from)+' · '+plStr(r.a.ep)})}if(r.gap<24*HR)avAdd(y,'rep',r.gap);continue}
  const st=wkStatus(r);if(st==='paye'||st==='rass'){const n=nightsIn(r.from,r.to),wx={t:r.from,x:fD(r.from)+' → '+fD(r.to)+' · '+plStr(r.a.ep)+' · '+fDur(r.gap)};b.nd+=n;b.L.nd.push({t:r.from,x:'Week-end '+(st==='rass'?'rassemblement':'payé')+' '+fD(r.from)+' → '+fD(r.to)+' · '+plStr(r.a.ep)+' · '+n+' nuit'+(n>1?'s':'')});if(st==='paye'){b.wep++;b.L.wep.push(wx)}else{b.rass++;const nm=(S.rass||{})[r.a.id];b.L.rass.push({...wx,id:r.a.id,x:(nm&&nm.name?nm.name+' · ':'')+wx.x})}}
  let clean=true;for(let k=dk(r.from);k<=dk(r.to);k=addDays(k,1)){const w=kDate(k).getDay();if(absOn(k)||(w>0&&w<6&&feries(+k.slice(0,4)).has(k))){clean=false;break}}
  if(clean)avAdd(y,'we',r.gap)}
 for(const [k,o] of Object.entries(S.km||{})){const a=num(o.start),b2=num(o.end);if(a!=null&&b2!=null&&b2>a){const [y,m]=k.split('-').map(Number);const bb=box(y,m-1)[0];bb.km=b2-a-gapKmIn(y,m-1);bb.L.km.push({t:new Date(y,m-1,1).getTime(),x:Mois(m-1)+' '+y+' · '+fkm(a)+' → '+fkm(b2)+' · '+fkm(b2-a)+' km'})}}
 for(const p of S.pleins){if(!p.g||!p.g.on)continue;const v=num(p.g.v);if(v==null)continue;const [y,m]=mk(p.t);const bb=box(y,m)[0];bb.gas+=v;bb.L.gas.push({t:p.t,x:fD(p.t)+' · '+(p.lieu&&p.lieu.n||'')+' · '+f1(v)+' L'+(p.full===false?' (partiel)':'')})}
 for(const o of Object.values(Y)){const t={days:0,we:0,fer:0,night:0,amp:0,nd:0,wep:0,rass:0,km:0,kmN:0,gas:0};
  for(const b of Object.values(o.months)){t.days+=b.days.size;t.we+=b.we.size;t.fer+=b.fer.size;t.night+=b.night;t.amp+=b.amp;t.nd+=b.nd;t.wep+=b.wep;t.rass+=b.rass;t.gas+=b.gas;if(b.km!=null){t.km+=b.km;t.kmN++}for(const k in b.L)(t.L=t.L||{})[k]=(t.L[k]||[]).concat(b.L[k])}o.tot=t}
 return {Y,av}}
const mTot=b=>({L:b.L,days:b.days.size,we:b.we.size,fer:b.fer.size,night:b.night,amp:b.amp,nd:b.nd,wep:b.wep,rass:b.rass,km:b.km,kmN:b.km!=null?1:0,gas:b.gas});
const avg=(x,k)=>x&&x[k]&&x[k][1]?x[k][0]/x[k][1]:null;
const ROWS=[['Jours travaillés',t=>t.days,'days'],['Sam. / dim. travaillés',t=>t.we,'we'],['Fériés travaillés',t=>t.fer,'fer'],['Services de nuit',t=>t.night,'night'],['Amplitude cumulée',t=>fH(t.amp||0),'amp'],['Nuits dehors',t=>t.nd,'nd'],['Week-ends payés',t=>t.wep,'wep'],['Rassemblements',t=>t.rass,'rass'],['Kilomètres',t=>t.kmN?fkm(t.km):'—','km'],['Gasoil',t=>t.gas?fkm(t.gas)+' L':'—','gas']];
let tileL=null;
const AROWS=[['Amplitude moyenne','amp',fDur],['Heure de départ','dep',fHM],['Heure de fin de journée','fin',fHM],['Repos entre deux journées','rep',fDur],['Durée d\'un week-end','we',fDur]];
let smk=null,cmp=null;
function statTiles(t){tileL=t.L||{};return `<div class="tiles" id="stl">${ROWS.map(([l,f,k])=>`<div class="stt" data-k="${k}" data-l="${esc(l)}"><span>${l}</span><b>${f(t)??0}</b></div>`).join('')}</div>`}
function tilesMount(){on('stl','onclick',e=>{const d=e.target.closest('[data-k]');if(!d)return;const L=((tileL||{})[d.dataset.k]||[]).slice().sort((a,b)=>a.t-b.t);
 sheet(`<h3>${d.dataset.l} : ${esc(d.querySelector('b').textContent)}</h3><ul class="list" id="tll">${L.map(i=>`<li ${i.id?`data-id="${i.id}"`:''}><div class="t">${esc(i.x)}</div>${i.id?'<span class="muted">›</span>':''}</li>`).join('')||'<li class="muted">Rien pour cette période</li>'}</ul><div class="acts"><button class="btn full" id="tlx">Fermer</button></div>`,(el,c)=>{$('tlx').onclick=c;$('tll').onclick=e=>{const li=e.target.closest('li[data-id]');if(li){c();openRass(li.dataset.id)}}})})}
function openRass(id){const A=analyze();const r=A.weeklies.find(x=>x.a.id===id);if(!r)return;S.rass=S.rass||{};const f=S.rass[id]||{};
 sheet(`<h3>${esc(f.name||'Rassemblement')}</h3><p class="muted" style="margin-top:-6px">${fD(r.from)} → ${fD(r.to)} · ${esc(plStr(r.a.ep))} · ${fDur(r.gap)}</p>
 <div class="fg"><label>Nom du rassemblement<input id="rs-n" value="${esc(f.name||'')}"></label></div>
 <div class="fg"><label>Notes<textarea id="rs-t" rows="3" style="display:block;width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px">${esc(f.notes||'')}</textarea></label></div>
 <label>Photos</label><div id="rs-ph" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px"></div>
 <label class="btn full" style="display:flex;align-items:center;justify-content:center;margin-top:8px;color:var(--ink);font-size:16px">+ Ajouter des photos<input type="file" id="rs-pa" accept="image/*" multiple style="display:none"></label>
 <div class="acts"><button class="btn" id="rs-x">Fermer</button><button class="btn pri" id="rs-ok">Enregistrer</button></div>`,(el,close)=>{
 const keep=()=>{S.rass[id]={name:$('rs-n').value.trim(),notes:$('rs-t').value};save()};
 const box=$('rs-ph');const draw=()=>phAll().then(a=>{const mine=a.filter(p=>p.rass===id).sort((x,y)=>x.t-y.t);box.innerHTML=mine.map(p=>`<img src="${p.data}" data-id="${p.id}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">`).join('')||'<span class="muted" style="grid-column:1/-1">Aucune photo</span>'}).catch(()=>{box.innerHTML='<span class="muted">Photos indisponibles ici</span>'});draw();
 box.onclick=e=>{const im=e.target.closest('img[data-id]');if(!im)return;keep();close();sheet(`<img src="${im.src}" style="width:100%;border-radius:10px"><div class="acts"><button class="btn red" id="phd">Supprimer</button><button class="btn" id="phx">Retour</button></div>`,(e2,c2)=>{$('phx').onclick=()=>{c2();openRass(id)};$('phd').onclick=async()=>{await phDel(im.dataset.id);c2();openRass(id)}})};
 $('rs-pa').onchange=async e=>{const fs=[...e.target.files];e.target.value='';let n=0;for(const f of fs){try{const d=await shrink(f);await phPut({id:uid(),rass:id,t:Date.now(),data:d});n++}catch(x){}}toast(n+' photo'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));draw()};
 $('rs-x').onclick=()=>{keep();close();render()};$('rs-ok').onclick=()=>{keep();close();render();toast('Rassemblement enregistré')}})}
function statsHTML(){const {Y,av}=computeStats();const years=Object.keys(Y).map(Number).sort();if(!years.includes(sy))sy=years[years.length-1]||new Date().getFullYear();
 const o=Y[sy]||{months:{},tot:{}};const a=av[sy]||{},g=av.all||{};const months=Object.keys(o.months).map(Number).sort((x,y)=>y-x);
 return `<h1>Stats</h1><div class="seg">${years.map(y=>`<button data-y="${y}" class="${y===sy?'on':''}">${y}</button>`).join('')}</div>
 <h2>Totaux ${sy}</h2>${statTiles(o.tot)}
 <h2>Moyennes</h2><ul class="list"><li><div class="t"></div><span class="muted">${sy}</span><span class="muted" style="min-width:74px;text-align:right">Toujours</span></li>
 ${AROWS.map(([l,k,f])=>{const v1=avg(a,k),v2=avg(g,k);return `<li><div class="t">${l}</div><b>${v1!=null?f(v1):'—'}</b><span class="muted" style="min-width:74px;text-align:right">${v2!=null?f(v2):'—'}</span></li>`}).join('')}</ul>
 <h2>Mois</h2><button class="btn full" id="scmp">Comparer des mois</button><ul class="list" id="smon">${months.map(mm=>`<li data-m="${sy}-${mm}"><div class="t"><b>${Mois(mm)} ${sy}</b></div><span class="muted">›</span></li>`).join('')}</ul>`}
function statMHTML(){const {Y,av}=computeStats();const [y,m]=smk.split('-').map(Number);const b=Y[y]&&Y[y].months[m];if(!b){view='stat';return statsHTML()}const a=av[y+'-'+m]||{};
 return `<div class="row" style="margin-bottom:4px"><button class="btn sm" id="bk-st">‹ Stats</button></div><h1>${Mois(m)} ${y}</h1>${statTiles(mTot(b))}
 <h2>Moyennes</h2><ul class="list">${AROWS.map(([l,k,f])=>{const v=avg(a,k);return `<li><div class="t">${l}</div><b>${v!=null?f(v):'—'}</b></li>`}).join('')}</ul>
 <button class="btn full" id="smcmp" style="margin-top:14px">Comparer avec un autre mois</button>`}
function allMonths(Y){const r=[];for(const y of Object.keys(Y).map(Number).sort((a,b)=>b-a))for(const m of Object.keys(Y[y].months).map(Number).sort((a,b)=>b-a))r.push(y+'-'+m);return r}
function statCHTML(){const {Y,av}=computeStats();const all=allMonths(Y);if(!cmp)cmp=all.slice(0,2).reverse();cmp=cmp.filter(k=>all.includes(k));
 const lab=k=>{const [y,m]=k.split('-').map(Number);return Mois(m).slice(0,4)+'. '+String(y).slice(2)};
 const cols=cmp.map(k=>{const [y,m]=k.split('-').map(Number);return {k,t:mTot(Y[y].months[m]),a:av[k]||{}}});
 const th=`<tr><th></th>${cols.map((c,i)=>`<th><button class="btn sm" data-chg="${i}" style="padding:0 8px">${lab(c.k)}</button>${cols.length>1?`<div><button class="btn sm" data-del="${i}" style="min-height:26px;margin-top:4px;padding:0 8px">✕</button></div>`:''}</th>`).join('')}</tr>`;
 const tr=ROWS.map(([l,f])=>`<tr><td>${l}</td>${cols.map(c=>`<td>${f(c.t)??0}</td>`).join('')}</tr>`).join('')+AROWS.map(([l,k,f])=>`<tr><td>${l}</td>${cols.map(c=>{const v=avg(c.a,k);return `<td>${v!=null?f(v):'—'}</td>`}).join('')}</tr>`).join('');
 return `<div class="row" style="margin-bottom:4px"><button class="btn sm" id="bk-st">‹ Stats</button></div><h1>Comparer</h1>
 <div class="scroll"><table class="cmpt"><thead>${th}</thead><tbody>${tr}</tbody></table></div>
 <button class="btn full" id="cadd" style="margin-top:12px">+ Ajouter un mois</button>`}
function pickMonth(cb){const {Y}=computeStats();const all=allMonths(Y);sheet(`<h3>Choisir un mois</h3><ul class="list" id="pkm">${all.map(k=>{const [y,m]=k.split('-').map(Number);return `<li data-k="${k}"><div class="t">${Mois(m)} ${y}</div></li>`}).join('')}</ul><div class="acts"><button class="btn full" id="pkx">Annuler</button></div>`,(el,close)=>{$('pkx').onclick=close;$('pkm').onclick=e=>{const li=e.target.closest('li[data-k]');if(li){close();cb(li.dataset.k)}}})}
function statsMount(){tilesMount();document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{sy=+b.dataset.y;render()});
 on('smon','onclick',e=>{const li=e.target.closest('li[data-m]');if(li){smk=li.dataset.m;view='statm';render();scrollTo(0,0)}});on('scmp','onclick',()=>{cmp=null;view='statc';render();scrollTo(0,0)});on('bk-more','onclick',openMore)}
function statMMount(){tilesMount();on('bk-st','onclick',()=>{view='stat';render()});on('smcmp','onclick',()=>{cmp=[smk];pickMonth(k=>{cmp.push(k);view='statc';render();scrollTo(0,0)})})}
function statCMount(){on('bk-st','onclick',()=>{view='stat';render()});on('cadd','onclick',()=>pickMonth(k=>{cmp.push(k);render()}));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{cmp.splice(+b.dataset.del,1);render()});
 document.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>pickMonth(k=>{cmp[+b.dataset.chg]=k;render()}))}

const IC={more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',stat:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3M7 7h5"/>',plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};

 $('tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-v="${k}" class="${view===k||(k==='more'&&MOREV.includes(view))?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[i]}</svg>${l}${dot[k]?'<span class="dot"></span>':''}</button>`).join('');
 const [h,mo]=V[view];try{$('app').innerHTML=h();mo()}catch(e){$('app').innerHTML='<div class="banner r">Erreur d\'affichage : '+esc(e.message)+'</div>';console.error(e)}}

render();startGPS();loadCommunes(false).then(()=>loadAires(false));
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){const had=!!navigator.serviceWorker.controller;let swReg=null,manual=false,pend=false,done=false;
 const UK='jp-upd-last',EVERY=6*HR;

 if(lsG('jp-upd-done')){lsS('jp-upd-done',null);setTimeout(()=>toast('Version '+APP_VERSION+' installée'),400)}
 const auto=()=>{if(!swReg||!navigator.onLine)return;const l=+lsG(UK)||0;if(Date.now()-l<EVERY)return;
  setTimeout(()=>{if(!navigator.onLine)return;swReg.update().then(()=>lsS(UK,String(Date.now()))).catch(()=>{})},4000)};
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;auto()}).catch(()=>{});
 const apply=()=>{if(!document.querySelector('.ov')){lsS('jp-upd-done','1');location.reload()}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(pend)apply();else auto()});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(done||!had)return;done=true;if(manual){lsS('jp-upd-done','1');location.reload()}else pend=true});
 window.__upd=async b=>{if(!swReg){toast('Mise à jour indisponible');return}if(!navigator.onLine){toast('Pas de réseau, réessaie plus tard');return}
  const t0=b.textContent;b.textContent='Recherche…';b.disabled=true;manual=true;
  try{await swReg.update();lsS(UK,String(Date.now()));const w=swReg.installing||swReg.waiting;
   if(w){b.textContent='Téléchargement…';if(pend){lsS('jp-upd-done','1');location.reload();return}setTimeout(()=>{if(!done){b.textContent=t0;b.disabled=false;toast('Téléchargement trop long, réessaie')}},30000)}
   else if(pend){lsS('jp-upd-done','1');location.reload()}
   else{manual=false;b.textContent=t0;b.disabled=false;toast('Déjà à jour ('+APP_VERSION+')')}}
  catch(e){manual=false;b.textContent=t0;b.disabled=false;toast('Pas de réseau, réessaie plus tard')}}}}catch(e){}
}
